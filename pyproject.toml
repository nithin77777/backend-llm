[project]
name = "backend"
version = "0.1.0"
description = "This is my Backend Project"
readme = "README.md"
authors = [
  { name = "Nithin", email = "nithin@krivolt.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
